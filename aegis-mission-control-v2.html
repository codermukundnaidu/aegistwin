<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AEGIS-TWIN // ORBITAL FDIR MISSION CONTROL v2</title>
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{
  gridTemplateRows:{'12':'repeat(12,minmax(0,1fr))'},
  fontFamily:{mono:['"JetBrains Mono"','monospace'],sans:['Inter','sans-serif']},
}}};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;}
#root{height:100%;}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#1E293B;border-radius:2px;}

@keyframes glow-c{0%,100%{box-shadow:0 0 6px rgba(0,240,255,.5),0 0 20px rgba(0,240,255,.15);}50%{box-shadow:0 0 16px rgba(0,240,255,.9),0 0 50px rgba(0,240,255,.3);}}
@keyframes glow-r{0%,100%{box-shadow:0 0 6px rgba(244,63,94,.5),0 0 20px rgba(244,63,94,.15);}50%{box-shadow:0 0 16px rgba(244,63,94,.9),0 0 50px rgba(244,63,94,.3);}}
@keyframes glow-a{0%,100%{box-shadow:0 0 5px rgba(245,158,11,.5);}50%{box-shadow:0 0 14px rgba(245,158,11,.9);}}
@keyframes glow-p{0%,100%{box-shadow:0 0 6px rgba(167,139,250,.5);}50%{box-shadow:0 0 16px rgba(167,139,250,.9);}}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
@keyframes log-in{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
@keyframes pulse-r{0%,100%{transform:translateY(-50%) scale(.9);opacity:.6;}50%{transform:translateY(-50%) scale(1.1);opacity:1;}}
@keyframes hb-line{0%,100%{opacity:1;}48%,52%{opacity:.08;}}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
@keyframes scanpulse{0%{background-position:-200% center;}100%{background-position:200% center;}}
@keyframes orb-flow{0%{cy:0;opacity:0;}10%{opacity:.9;}90%{opacity:.9;}100%{cy:22;opacity:0;}}

.gc{animation:glow-c 1.8s ease-in-out infinite;}
.gr{animation:glow-r 1s ease-in-out infinite;}
.ga{animation:glow-a 1.4s ease-in-out infinite;}
.gp{animation:glow-p 1.8s ease-in-out infinite;}
.blink{animation:blink 1s step-end infinite;}
.log-in{animation:log-in .2s ease-out both;}
.pr{animation:pulse-r 1.4s ease-in-out infinite;position:absolute;right:6px;width:5px;height:5px;border-radius:50%;}
.fade-up{animation:fadeUp .3s ease-out both;}

input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;outline:none;cursor:pointer;background:transparent;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:12px;height:12px;border-radius:50%;border:2px solid currentColor;background:#070A12;cursor:pointer;box-shadow:0 0 5px currentColor;transition:transform .15s;}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.3);}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;background:#070A12;cursor:pointer;}

.hw-block{border:1px solid #1E293B;border-radius:5px;padding:5px 9px;display:flex;align-items:center;gap:6px;background:rgba(7,10,18,.75);transition:border-color .35s,box-shadow .35s,background .35s;position:relative;overflow:hidden;}
.hw-block.act{border-color:rgba(0,240,255,.7);background:rgba(0,240,255,.04);box-shadow:0 0 14px rgba(0,240,255,.18);}
.hw-block.alert{border-color:rgba(244,63,94,.7);background:rgba(244,63,94,.04);box-shadow:0 0 14px rgba(244,63,94,.18);}
.hw-block.warn{border-color:rgba(245,158,11,.7);background:rgba(245,158,11,.04);box-shadow:0 0 10px rgba(245,158,11,.14);}

.scanlines::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,240,255,.006) 2px,rgba(0,240,255,.006) 4px);}
.conn{height:20px;display:flex;justify-content:center;align-items:center;position:relative;}
</style>
</head>
<body class="bg-[#070A12]">
<div id="root" style="height:100%;"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

/* ═══════════════ CONSTANTS ═══════════════ */
const ST={NOMINAL:'NOMINAL',ANOMALY:'ANOMALY_DETECTED',SANDBOX:'SANDBOX_EVALUATION',RECOVERED:'RECOVERY_VERIFIED'};
const AI={
  SLEEP: {label:'AI_DEEP_SLEEP',  w:0.0,col:'#64748B'},
  WAKING:{label:'AI_WAKING',      w:3.2,col:'#F59E0B'},
  ACTIVE:{label:'AI_ACTIVE',      w:6.8,col:'#00F0FF'},
  INFER: {label:'INFERENCE',      w:9.4,col:'#A78BFA'},
  SLEEP2:{label:'ENTERING_SLEEP', w:1.1,col:'#64748B'},
};
const NOM={busV:7.4,battT:28,solar:11.2,fLoad:1.8,soc:88,elecT:32,wdLimit:10.0};
const SC={
  thermal:  {label:'INJECT ADCS THERMAL RUNAWAY',     col:'#F43F5E',msg:'ADCS Thermal Spike (85.4°C)',                         gap:42,conf:96.4,fault:'ADCS Thermal Latch-up',   ov:{battT:85.4,busV:4.2},postV:7.1,postT:31.2,violT:89.2},
  radiation:{label:'INJECT SEU BIT-FLIP (RADIATION)', col:'#A78BFA',msg:'SEU Bit-Flip in AI Register Bank',                   gap:18,conf:89.1,fault:'Radiation SEU Corruption',ov:{soc:22,busV:5.8},    postV:7.3,postT:28.1,violT:71.0},
  sensor:   {label:'INJECT UNKNOWN SENSOR CORRUPTION',col:'#F59E0B',msg:'UNKNOWN SENSOR STATE — Uncertainty Threshold Exceeded',gap:67,conf:54.2,fault:'Sensor Data Corruption', ov:{fLoad:9.8,battT:58},  postV:7.0,postT:33.5,violT:78.5},
};

/* ═══════════════ ORBIT CANVAS ═══════════════ */
function OrbitCanvas({sysState}){
  const ref=useRef(null);
  const raf=useRef(null);
  const ang=useRef(3.42);
  useEffect(()=>{
    const cv=ref.current; if(!cv)return;
    const ctx=cv.getContext('2d');
    const STARS=Array.from({length:120},()=>({
      x:Math.random(),y:Math.random(),r:Math.random()*.95+.2,
      ph:Math.random()*Math.PI*2,sp:Math.random()*.001+.0003,
    }));
    function frame(){
      const W=cv.width=cv.offsetWidth,H=cv.height=cv.offsetHeight;
      if(!W||!H){raf.current=requestAnimationFrame(frame);return;}
      const cx=W*.5,cy=H*.5;
      const gr=Math.min(W,H)*.255;
      const or=gr*1.78;
      const tilt=.34;
      const t=Date.now();
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle='#070A12';ctx.fillRect(0,0,W,H);
      // Stars
      STARS.forEach(s=>{
        const op=.1+.65*(.5+.5*Math.sin(t*s.sp+s.ph));
        ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(185,215,255,${op.toFixed(2)})`;ctx.fill();
      });
      const cS=3.18,cE=5.08;
      // Silence zone tint
      if(sysState!==ST.NOMINAL){
        ctx.save();
        ctx.beginPath();ctx.ellipse(cx,cy,or,or*tilt,0,cE,cS+Math.PI*2);
        ctx.strokeStyle='rgba(244,63,94,.05)';ctx.lineWidth=24;ctx.stroke();
        ctx.restore();
      }
      // Full orbit ring
      ctx.save();
      ctx.beginPath();ctx.ellipse(cx,cy,or,or*tilt,0,0,Math.PI*2);
      ctx.strokeStyle='rgba(100,148,255,.1)';ctx.lineWidth=1;
      ctx.setLineDash([5,7]);ctx.stroke();ctx.setLineDash([]);
      ctx.restore();
      // Contact arc
      ctx.save();
      ctx.beginPath();ctx.ellipse(cx,cy,or,or*tilt,0,cS,cE);
      ctx.strokeStyle='rgba(16,185,129,.95)';ctx.lineWidth=3.5;ctx.stroke();
      ctx.beginPath();ctx.ellipse(cx,cy,or,or*tilt,0,cS,cE);
      ctx.strokeStyle='rgba(16,185,129,.12)';ctx.lineWidth=13;ctx.stroke();
      ctx.restore();
      // Silence arc
      ctx.save();
      ctx.beginPath();ctx.ellipse(cx,cy,or,or*tilt,0,cE,cS+Math.PI*2);
      const sOp=sysState!==ST.NOMINAL?.82:.28;
      ctx.strokeStyle=`rgba(244,63,94,${sOp})`;
      ctx.lineWidth=sysState!==ST.NOMINAL?2.5:1.5;ctx.stroke();
      ctx.restore();
      // Labels
      ctx.save();
      ctx.font='8px "JetBrains Mono",monospace';
      ctx.fillStyle='rgba(16,185,129,.88)';
      ctx.fillText('▼ GROUND CONTACT PASS',cx+or*.04,cy+or*tilt+15);
      ctx.fillStyle=sysState!==ST.NOMINAL?'rgba(244,63,94,.95)':'rgba(244,63,94,.5)';
      ctx.fillText('▲ RADIO SILENCE / ECLIPSE',cx-or*.75,cy-or*tilt-7);
      ctx.restore();
      // Globe
      const gg=ctx.createRadialGradient(cx-gr*.2,cy-gr*.16,gr*.06,cx,cy,gr);
      gg.addColorStop(0,'#1d4285');gg.addColorStop(.5,'#0d254c');gg.addColorStop(1,'#040e22');
      ctx.beginPath();ctx.arc(cx,cy,gr,0,Math.PI*2);ctx.fillStyle=gg;ctx.fill();
      // Globe grid
      ctx.save();
      ctx.strokeStyle='rgba(0,240,255,.07)';ctx.lineWidth=.5;
      for(let lt=-60;lt<=60;lt+=20){
        const lr=gr*Math.cos(lt*Math.PI/180),ly=cy+gr*Math.sin(lt*Math.PI/180);
        if(lr>2){ctx.beginPath();ctx.ellipse(cx,ly,lr,lr*.19,0,0,Math.PI*2);ctx.stroke();}
      }
      for(let ln=0;ln<180;ln+=30){
        ctx.beginPath();ctx.ellipse(cx,cy,gr*Math.cos(ln*Math.PI/180),gr,0,0,Math.PI*2);ctx.stroke();
      }
      ctx.restore();
      // Globe rim + atmosphere
      ctx.beginPath();ctx.arc(cx,cy,gr,0,Math.PI*2);
      ctx.strokeStyle='rgba(0,240,255,.28)';ctx.lineWidth=1;ctx.stroke();
      const atm=ctx.createRadialGradient(cx,cy,gr*.96,cx,cy,gr*1.11);
      atm.addColorStop(0,'rgba(0,240,255,.14)');atm.addColorStop(1,'rgba(0,240,255,0)');
      ctx.beginPath();ctx.arc(cx,cy,gr*1.11,0,Math.PI*2);ctx.fillStyle=atm;ctx.fill();
      // Ground station
      const gsa=4.08;
      const gsx=cx+or*Math.cos(gsa),gsy=cy+or*tilt*Math.sin(gsa);
      for(let i=1;i<=3;i++){
        ctx.beginPath();ctx.arc(gsx,gsy,i*7+(t/310%7),0,Math.PI*2);
        ctx.strokeStyle=`rgba(16,185,129,${.4-i*.09})`;ctx.lineWidth=1;ctx.stroke();
      }
      ctx.beginPath();ctx.arc(gsx,gsy,4.5,0,Math.PI*2);ctx.fillStyle='#10B981';ctx.fill();
      ctx.font='7px "JetBrains Mono",monospace';
      ctx.fillStyle='#10B981';ctx.fillText('GS-1',gsx+6,gsy-3);
      // Satellite
      const sa=ang.current;
      const sx=cx+or*Math.cos(sa),sy=cy+or*tilt*Math.sin(sa);
      const inSil=(sa>cE||sa<cS);
      const sCol=inSil?(sysState!==ST.NOMINAL?'#F43F5E':'#F59E0B'):'#10B981';
      // Trail
      for(let i=1;i<=18;i++){
        const ta=sa-i*.048;
        ctx.beginPath();ctx.arc(cx+or*Math.cos(ta),cy+or*tilt*Math.sin(ta),1.4,0,Math.PI*2);
        ctx.fillStyle=`rgba(0,240,255,${((1-i/18)*.38).toFixed(2)})`;ctx.fill();
      }
      // Anomaly halo
      if(sysState!==ST.NOMINAL&&inSil){
        const hl=ctx.createRadialGradient(sx,sy,0,sx,sy,28);
        hl.addColorStop(0,'rgba(244,63,94,.5)');hl.addColorStop(1,'rgba(244,63,94,0)');
        ctx.beginPath();ctx.arc(sx,sy,28,0,Math.PI*2);ctx.fillStyle=hl;ctx.fill();
      }
      // CubeSat body
      ctx.save();ctx.translate(sx,sy);ctx.rotate(sa+Math.PI*.5);
      ctx.fillStyle='#1E3A8A';
      ctx.fillRect(-14,-3,9,6);ctx.fillRect(5,-3,9,6);
      ctx.strokeStyle=sCol;ctx.lineWidth=.8;
      ctx.strokeRect(-14,-3,9,6);ctx.strokeRect(5,-3,9,6);
      ctx.fillStyle='#0F172A';ctx.fillRect(-6,-6,12,12);
      ctx.strokeStyle=sCol;ctx.lineWidth=2;ctx.strokeRect(-6,-6,12,12);
      ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(0,-11);
      ctx.strokeStyle=`${sCol}80`;ctx.lineWidth=1;ctx.stroke();
      ctx.restore();
      // Ground contact line
      if(!inSil&&sysState===ST.NOMINAL){
        ctx.save();ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(gsx,gsy);
        ctx.strokeStyle='rgba(16,185,129,.18)';ctx.lineWidth=1;
        ctx.setLineDash([4,4]);ctx.stroke();ctx.setLineDash([]);ctx.restore();
      }
      // Fault label
      if(sysState!==ST.NOMINAL&&inSil){
        ctx.save();ctx.font='bold 9px "JetBrains Mono",monospace';ctx.fillStyle='#F43F5E';
        ctx.fillText('⚠ FAULT — NO GROUND LINK',sx>cx?sx-142:sx+10,sy-18);ctx.restore();
      }
      // Footer
      ctx.save();ctx.font='7.5px "JetBrains Mono",monospace';
      ctx.fillStyle='rgba(100,148,255,.5)';
      ctx.fillText('LEO 550 km  |  INC: 97.4°  |  PERIOD: 92 MIN  |  ALT: 550 km',cx-130,H-8);
      ctx.restore();
      ang.current=(sa+.003)%(Math.PI*2);
      raf.current=requestAnimationFrame(frame);
    }
    frame();
    return()=>{if(raf.current)cancelAnimationFrame(raf.current);};
  },[sysState]);
  return <canvas ref={ref} style={{width:'100%',height:'100%',display:'block',willChange:'transform'}} />;
}

/* ═══════════════ HARDWARE TWIN ═══════════════ */
function HardwareTwin({sysState,aiState,wdSec,wdMax,gatePass}){
  const isAct=sysState!==ST.NOMINAL;
  const isEval=sysState===ST.SANDBOX||sysState===ST.RECOVERED;
  const isRec=sysState===ST.RECOVERED;
  const wdPct=Math.max(0,Math.min(1,wdSec/wdMax));
  const circ=2*Math.PI*18;
  const wdCol=wdPct>.6?'#10B981':wdPct>.3?'#F59E0B':'#F43F5E';

  function Block({id,icon,label,sub}){
    const s=
      id==='adcs'&&sysState===ST.ANOMALY?'alert':
      id==='ai'&&aiState.label!==AI.SLEEP.label?'act':
      id==='obc'&&isAct?'warn':
      id==='watchdog'&&isAct?'warn':'';
    const tc=s==='act'?'#00F0FF':s==='alert'?'#F43F5E':s==='warn'?'#F59E0B':'#475569';
    return(
      <div className={`hw-block ${s}`}>
        <span style={{fontSize:13,lineHeight:1}}>{icon}</span>
        <div style={{minWidth:0}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8.5,color:tc,fontWeight:600,whiteSpace:'nowrap'}}>{label}</div>
          {sub&&<div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7,color:'#374151',marginTop:1}}>{sub}</div>}
        </div>
        {s==='act'&&<div className="pr" style={{background:'#00F0FF',boxShadow:'0 0 7px #00F0FF'}} />}
        {s==='alert'&&<div className="pr" style={{background:'#F43F5E',boxShadow:'0 0 7px #F43F5E'}} />}
      </div>
    );
  }

  function Conn({active,col='#00F0FF',label}){
    return(
      <div style={{display:'flex',justifyContent:'center',alignItems:'center',height:20,position:'relative'}}>
        <svg width="180" height="20" style={{overflow:'visible'}}>
          <line x1="90" y1="0" x2="90" y2="20"
            stroke={active?col:'#1E293B'} strokeWidth={active?2:1}
            style={{transition:'stroke .35s,strokeWidth .35s'}}/>
          <polygon points="86,14 90,20 94,14" fill={active?col:'#1E293B'} style={{transition:'fill .35s'}}/>
          {active&&[0,.5,1].map(d=>(
            <circle key={d} cx="90" cy="0" r="2" fill={col} opacity=".85">
              <animateMotion dur=".7s" begin={`${d}s`} repeatCount="indefinite" path="M0 0 L0 20"/>
            </circle>
          ))}
          {label&&<text x="96" y="14" fontSize="7" fontFamily="'JetBrains Mono',monospace" fill={active?col:'#2d3f5e'}>{label}</text>}
        </svg>
      </div>
    );
  }

  function GPIOLines({active}){
    return(
      <div style={{padding:'3px 0',width:'100%'}}>
        {[{l:'GPIO_PIN_4  (POWER GATE)',c:'#00F0FF',d:'.6s'},{l:'WATCHDOG HEARTBEAT  (1 Hz)',c:'#F59E0B',d:'1s'}].map(({l,c,d},i)=>(
          <div key={i} style={{marginBottom:5}}>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7,color:active?c:'#1E293B',marginBottom:2,transition:'color .35s'}}>{l}</div>
            <div style={{position:'relative',height:2,borderRadius:1,background:'#1E293B',overflow:'hidden'}}>
              <div style={{position:'absolute',inset:0,borderRadius:1,background:active?c:'transparent',boxShadow:active?`0 0 5px ${c}`:'none',transition:'all .35s'}}/>
              {active&&<div style={{position:'absolute',top:0,left:'-55%',width:'55%',height:'100%',background:'linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)',animation:`hb-line ${d} ease-in-out infinite`}}/>}
            </div>
          </div>
        ))}
      </div>
    );
  }

  return(
    <div style={{display:'flex',gap:8,padding:'6px 10px',height:'100%',alignItems:'stretch'}}>
      {/* Main column */}
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'space-evenly'}}>
        {/* Row 1: payload + comms */}
        <div style={{display:'flex',gap:6,width:'100%'}}>
          <div style={{flex:1}}><Block id="payload" icon="🛰" label="PAYLOAD" sub="Imager / Science Bus"/></div>
          <div style={{flex:1}}><Block id="comms" icon="📡" label="COMMS" sub="UHF 437 MHz · S-Band"/></div>
        </div>
        <Conn active={isAct} col="#F59E0B" label="28V BUS"/>
        {/* Row 2: Master OBC */}
        <div style={{width:'100%'}}><Block id="obc" icon="⚙️" label="MASTER OBC" sub="FreeRTOS · Hard Real-Time C++"/></div>
        {/* GPIO lines */}
        <div style={{width:'100%'}}><GPIOLines active={isAct}/></div>
        {/* Row 3: Edge-AI + Safety Gate */}
        <div style={{display:'flex',gap:6,width:'100%',alignItems:'stretch'}}>
          <div style={{flex:2}}><Block id="ai" icon="🧠" label="EDGE-AI COPROCESSOR" sub={`${aiState.label}  [${aiState.w.toFixed(1)}W]`}/></div>
          <div style={{
            flex:1,border:`1px solid ${isEval?(gatePass?'rgba(16,185,129,.7)':'rgba(244,63,94,.7)'):'#1E293B'}`,
            borderRadius:5,padding:'5px 7px',
            background:isEval?(gatePass?'rgba(16,185,129,.05)':'rgba(244,63,94,.05)'):'rgba(7,10,18,.7)',
            display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,
            transition:'all .4s',
            boxShadow:isEval?(gatePass?'0 0 12px rgba(16,185,129,.28)':'0 0 12px rgba(244,63,94,.28)'):'none',
          }}>
            <span style={{fontSize:13}}>{isRec?'✅':isEval?'⚡':'🔒'}</span>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7,color:isEval?(gatePass?'#10B981':'#F43F5E'):'#374151',textAlign:'center',lineHeight:1.4,fontWeight:600}}>SAFETY<br/>GATE</div>
            {isEval&&<div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:6.5,color:gatePass?'#10B981':'#F43F5E'}}>{gatePass?'PASS':'BLOCK'}</div>}
          </div>
        </div>
        <Conn active={isAct} col="#10B981" label="TEMPLATE"/>
        {/* Row 4: EPS + ADCS */}
        <div style={{display:'flex',gap:6,width:'100%'}}>
          <div style={{flex:1}}><Block id="eps" icon="🔋" label="EPS / BATTERY" sub="28V LiPo Stack"/></div>
          <div style={{flex:1}}><Block id="adcs" icon="🔄" label="ADCS" sub="Reaction Wheels"/></div>
        </div>
      </div>

      {/* Watchdog column */}
      {isAct&&(
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:6,minWidth:60,borderLeft:'1px solid #1E293B',paddingLeft:10}} className="fade-up">
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7,color:'#F59E0B',letterSpacing:'.1em',textAlign:'center',lineHeight:1.4}}>HW<br/>WATCHDOG</div>
          <svg width="50" height="50" viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="18" fill="none" stroke="#1E293B" strokeWidth="3.5"/>
            <circle cx="25" cy="25" r="18" fill="none" stroke={wdCol} strokeWidth="3.5"
              strokeLinecap="round"
              strokeDasharray={circ}
              strokeDashoffset={circ*(1-wdPct)}
              transform="rotate(-90 25 25)"
              style={{transition:'stroke-dashoffset .1s linear,stroke .5s',filter:`drop-shadow(0 0 3px ${wdCol})`}}/>
            <text x="25" y="29" textAnchor="middle" fontSize="9" fontFamily="'JetBrains Mono',monospace" fill={wdCol} fontWeight="700">{wdSec.toFixed(1)}s</text>
          </svg>

/* ═══════════════ SAFETY GATE READOUT ═══════════════ */
function SafetyGate({tel,sysState}){
  const act=sysState!==ST.NOMINAL;
  const cur=tel.fLoad/Math.max(tel.busV,.1)*1.2;
  const rules=[
    {l:'Bus Voltage ≥ 6.0V',  v:`${tel.busV.toFixed(2)}V`,  ok:tel.busV>=6.0},
    {l:'Battery Temp ≤ 65°C', v:`${tel.battT.toFixed(1)}°C`,ok:tel.battT<=65},
    {l:'Max Current ≤ 3.5A',  v:`${cur.toFixed(2)}A`,       ok:cur<=3.5},
    {l:'Battery SOC ≥ 30%',   v:`${tel.soc.toFixed(0)}%`,   ok:tel.soc>=30},
  ];
  const all=rules.every(r=>r.ok);
  return(
    <div style={{border:`1px solid ${act?(all?'rgba(16,185,129,.45)':'rgba(244,63,94,.45)'):'#1E293B'}`,borderRadius:5,padding:'7px 10px',background:'rgba(7,10,18,.7)',transition:'border-color .4s',marginBottom:8}}>
      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7.5,letterSpacing:'.12em',textTransform:'uppercase',color:'#475569',marginBottom:6}}>DETERMINISTIC SAFETY GATE</div>
      <div style={{display:'flex',flexDirection:'column',gap:3.5}}>
        {rules.map(r=>(
          <div key={r.l} style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7.5,color:'#475569'}}>{r.l}</span>
            <div style={{display:'flex',alignItems:'center',gap:5}}>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7.5,color:'#2d3f5e'}}>{r.v}</span>
              <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:r.ok?'#10B981':'#F43F5E',fontWeight:700,lineHeight:1}}>{r.ok?'✓':'✗'}</span>
            </div>
          </div>
        ))}
      </div>
      {act&&(
        <div style={{marginTop:6,padding:'3px 8px',borderRadius:4,textAlign:'center',background:all?'rgba(16,185,129,.08)':'rgba(244,63,94,.08)',border:`1px solid ${all?'rgba(16,185,129,.3)':'rgba(244,63,94,.3)'}`,fontFamily:"'JetBrains Mono',monospace",fontSize:8.5,color:all?'#10B981':'#F43F5E'}}>
          {all?'✓ GATE PASS — Template Cleared':'✗ GATE BLOCK — Unsafe Proposal Rejected'}
        </div>
      )}
    </div>
  );
}

/* ═══════════════ XAI LOG ═══════════════ */
function XAILog({entries,running}){
  const ref=useRef(null);
  useEffect(()=>{if(ref.current)ref.current.scrollTop=ref.current.scrollHeight;},[entries]);
  const sc={OBC:'#4FC3F7',WATCHDOG:'#F59E0B',AI:'#A78BFA',TWIN:'#10B981','SAFETY GATE':'#F43F5E'};
  const lc={CRITICAL:'#F43F5E',INFO:'#475569',PASS:'#10B981',BLOCK:'#F43F5E',EXEC:'#00F0FF',SUCCESS:'#10B981',WARN:'#F59E0B'};
  return(
    <div ref={ref} style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:.5}}>
      {entries.length===0&&(
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8.5,color:'#1E293B',padding:'6px 0'}}>
          {'// Awaiting mission event'}<span className="blink">_</span>

          <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:sc[e.src]||'#475569',whiteSpace:'nowrap',minWidth:74,fontWeight:600}}>[{e.src}]</span>

}

/* ═══════════════ SLIDER ═══════════════ */
function Slider({label,val,min,max,step,unit,onChange,floorMin,ceilMax,col='#00F0FF'}){
  const pct=((val-min)/(max-min))*100;
  const warn=(floorMin!==undefined&&val<floorMin)||(ceilMax!==undefined&&val>ceilMax);
  const c=warn?'#F43F5E':col;
  return(
    <div style={{marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
        <label style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8.5,color:'#475569'}}>{label}</label>
        <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:warn?'#F43F5E':'#c8d8e8',fontWeight:600}}>{val.toFixed(step<.1?2:step<1?1:0)}{unit}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={val}
        onChange={e=>onChange(parseFloat(e.target.value))}
        style={{width:'100%',color:c,background:`linear-gradient(90deg,${c}70 0%,${c}70 ${pct}%,#1E293B ${pct}%,#1E293B 100%)`}}/>
      {(floorMin!==undefined||ceilMax!==undefined)&&(
        <div style={{display:'flex',justifyContent:'space-between',marginTop:2}}>
          {floorMin!==undefined&&<span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:6.5,color:'#243450'}}>floor: {floorMin}{unit}</span>}
          {ceilMax!==undefined&&<span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:6.5,color:'#243450',marginLeft:'auto'}}>ceil: {ceilMax}{unit}</span>}
        </div>
      )}
    </div>
  );
}

/* ═══════════════ LED BADGE ═══════════════ */
function LED({label,sub,col,glow}){
  return(
    <div style={{display:'flex',alignItems:'center',gap:7}}>

      <div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:col,fontWeight:700,lineHeight:1.2}}>{label}</div>
        {sub&&<div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7,color:'#374151',lineHeight:1.2}}>{sub}</div>}

}

/* ═══════════════ APP ═══════════════ */
function App(){
  const [tel,setTel]=useState({...NOM});
  const [sysState,setSysState]=useState(ST.NOMINAL);
  const [aiState,setAiState]=useState(AI.SLEEP);
  const [logs,setLogs]=useState([]);
  const [running,setRunning]=useState(false);
  const [wdSec,setWdSec]=useState(NOM.wdLimit);
  const [gatePass,setGatePass]=useState(null);
  const [scenario,setScenario]=useState(null);
  const t0=useRef(null);
  const wdIv=useRef(null);
  const timers=useRef([]);

  const clearAll=()=>{
    timers.current.forEach(clearTimeout);
    timers.current=[];
    if(wdIv.current)clearInterval(wdIv.current);
  };

  const addLog=useCallback((src,lvl,msg,delay)=>{
    timers.current.push(setTimeout(()=>{
      const ms=Date.now()-(t0.current||Date.now());
      const s=(ms/1000).toFixed(1).padStart(4,'0');
      setLogs(p=>[...p,{ts:`[${s}]`,src,lvl,msg}]);
    },delay));
  },[]);

  const go=useCallback((sc)=>{
    if(running)return;
    clearAll();
    setRunning(true);
    setScenario(sc);
    t0.current=Date.now();
    setLogs([]);
    setWdSec(NOM.wdLimit);
    setGatePass(null);
    setTel(p=>({...p,...sc.ov}));
    setSysState(ST.ANOMALY);
    setAiState(AI.WAKING);
    // Log sequence
    const seq=[
      {d:0,    src:'OBC',         lvl:'CRITICAL',msg:`CRITICAL: ${sc.msg}. Ground Contact: ${sc.gap}m away.`},
      {d:280,  src:'OBC',         lvl:'INFO',    msg:'Waking Coprocessor. Asserting GPIO_PIN_4 HIGH.'},
      {d:480,  src:'WATCHDOG',    lvl:'INFO',    msg:`${NOM.wdLimit.toFixed(1)}s Countdown Armed. Kill-switch engaged.`},
      {d:1100, src:'AI',          lvl:'INFO',    msg:`Diagnostics Complete: ${sc.conf}% confidence — ${sc.fault}.`},
      {d:1700, src:'TWIN',        lvl:'INFO',    msg:'Simulating Branch α: EMERGENCY_SAFE_MODE.'},
      {d:1950, src:'TWIN',        lvl:'INFO',    msg:'Simulating Branch β: RESTART_ADCS_CONTROLLER.'},
      {d:2200, src:'TWIN',        lvl:'INFO',    msg:'Simulating Branch γ: OVERVOLT_HEATER_BYPASS.'},
      {d:2750, src:'SAFETY GATE', lvl:'PASS',    msg:`Branch α: Voltage ${sc.postV}V ✓ | Temp 38°C ✓ | SOC OK ✓ → [PASS]`},
      {d:3050, src:'SAFETY GATE', lvl:'PASS',    msg:`Branch β: Voltage ${sc.postV}V ✓ | Temp ${sc.postT}°C ✓ | SOC OK ✓ → [PASS / SELECTED]`},
      {d:3350, src:'SAFETY GATE', lvl:'BLOCK',   msg:`Branch γ: Temp VIOLATION ${sc.violT}°C > 65°C → [BLOCKED BY GATE]`},
      {d:3900, src:'OBC',         lvl:'EXEC',    msg:'Executing Template #14: Power Cycle ADCS Controller.'},
      {d:4450, src:'OBC',         lvl:'INFO',    msg:`ADCS Thermal nominal: ${sc.postT}°C. Bus voltage nominal: ${sc.postV}V.`},
      {d:5150, src:'OBC',         lvl:'INFO',    msg:'De-asserting GPIO_PIN_4. Coprocessor entering Deep Sleep.'},
      {d:5600, src:'WATCHDOG',    lvl:'INFO',    msg:'Heartbeat received. Countdown cancelled. System nominal.'},
      {d:6150, src:'OBC',         lvl:'SUCCESS', msg:`Recovery verified. Mission state: RECOVERY_VERIFIED. XAI Log: 128B (saved 98.6%).`},
    ];
    seq.forEach(({d,src,lvl,msg})=>addLog(src,lvl,msg,d));
    // State machine transitions
    const sched=(fn,d)=>{timers.current.push(setTimeout(fn,d));};
    sched(()=>setAiState(AI.ACTIVE),480);
    sched(()=>setAiState(AI.INFER),1100);
    sched(()=>setSysState(ST.SANDBOX),1700);
    sched(()=>setGatePass(true),2750);
    sched(()=>{setSysState(ST.RECOVERED);setTel(p=>({...p,busV:sc.postV,battT:sc.postT}));},3900);
    sched(()=>setAiState(AI.SLEEP2),5150);
    sched(()=>{setAiState(AI.SLEEP);setRunning(false);setWdSec(NOM.wdLimit);},6150);
    // Auto-return to NOMINAL bench after watchdog cycle completes
    sched(()=>{
      setSysState(ST.NOMINAL);setTel({...NOM});setGatePass(null);setScenario(null);
      setLogs(p=>[...p,{ts:'[auto]',src:'OBC',lvl:'SUCCESS',msg:'Ground contact re-established. Full telemetry downlinked. System NOMINAL.'}]);
    },10200);
    // Watchdog countdown
    const start=Date.now();const dur=6100;
    wdIv.current=setInterval(()=>{
      const el=(Date.now()-start)/dur;
      setWdSec(Math.max(0,NOM.wdLimit*(1-el)));
      if(el>=1)clearInterval(wdIv.current);
    },50);
  },[running,addLog]);

  const reset=()=>{
    clearAll();setSysState(ST.NOMINAL);setAiState(AI.SLEEP);
    setTel({...NOM});setLogs([]);setRunning(false);
    setWdSec(NOM.wdLimit);setGatePass(null);setScenario(null);
  };

  const upd=k=>v=>setTel(p=>({...p,[k]:v}));

  const stCfg={
    [ST.NOMINAL]:  {lbl:'NOMINAL',    col:'#10B981',glow:false},
    [ST.ANOMALY]:  {lbl:'ANOMALY',    col:'#F43F5E',glow:true},
    [ST.SANDBOX]:  {lbl:'EVALUATING', col:'#F59E0B',glow:true},
    [ST.RECOVERED]:{lbl:'RECOVERING', col:'#F59E0B',glow:false},
  };
  const st=stCfg[sysState];

  /* ─── LAYOUT ─────────────────────────────────────────────────────────── */
  return(
    <div style={{
      height:'100vh',width:'100vw',overflow:'hidden',background:'#070A12',
      display:'grid',
      gridTemplateColumns:'repeat(12,1fr)',
      gridTemplateRows:'auto 1fr',
      gap:'10px',padding:'10px',
    }}>

      {/* ══ STATUS STRIP ══════════════════════════════════════════════════ */}
      <div style={{
        gridColumn:'span 12',
        background:'#0F172A',border:'1px solid #1E293B',borderRadius:7,
        padding:'0 16px',display:'flex',alignItems:'center',justifyContent:'space-between',
        height:46,flexShrink:0,position:'relative',overflow:'hidden',
      }}>
        {/* Left: identity */}
        <div>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11.5,color:'#00F0FF',fontWeight:700,letterSpacing:'.07em'}}>
            AEGIS-TWIN // ORBITAL FDIR BENCHMARK
          </div>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7.5,color:'#374151',marginTop:1}}>
            BUS-ID: DSU-CUBESAT-1U &nbsp;│&nbsp; LEO 550 km &nbsp;│&nbsp; INC: 97.4° &nbsp;│&nbsp; PERIOD: 92 MIN
          </div>
        </div>
        {/* Center: state LEDs */}
        <div style={{display:'flex',alignItems:'center',gap:18}}>
          <LED label={st.lbl} sub="MASTER STATE" col={st.col} glow={st.glow}/>
          <div style={{width:1,height:24,background:'#1E293B'}}/>
          <LED label={aiState.label} sub={`[${aiState.w.toFixed(1)} W]`} col={aiState.col} glow={aiState!==AI.SLEEP&&aiState!==AI.SLEEP2}/>
          <div style={{width:1,height:24,background:'#1E293B'}}/>
          <div style={{display:'flex',alignItems:'center',gap:7}}>
            <div style={{width:7,height:7,borderRadius:'50%',background:sysState===ST.NOMINAL?'#10B981':'#374151',boxShadow:sysState===ST.NOMINAL?'0 0 6px #10B981':'none',flexShrink:0,transition:'all .4s'}}/>
            <div>
              <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:'#64748B',fontWeight:600}}>OBC WATCHDOG</div>
              <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7,color:'#374151'}}>
                {sysState!==ST.NOMINAL?`${wdSec.toFixed(1)}s REMAINING`:`${tel.wdLimit.toFixed(1)}s NOMINAL`}

        {/* Right: downlink savings */}

              background:running?'rgba(30,41,59,.15)':`${s.col}10`,
              border:`1px solid ${running?'#1E293B':s.col+'45'}`,
              borderRadius:4,color:running?'#374151':s.col,
              fontFamily:"'JetBrains Mono',monospace",fontSize:8.5,
              cursor:running?'not-allowed':'pointer',textAlign:'left',
              letterSpacing:'.03em',transition:'all .2s',lineHeight:1.4,
            }}
            onMouseEnter={e=>{if(!running)e.currentTarget.style.background=`${s.col}20`;}}
            onMouseLeave={e=>{if(!running)e.currentTarget.style.background=`${s.col}10`;}}>
              ⚡ {s.label}
            </button>
          ))}

          {sysState!==ST.NOMINAL&&!running&&(
            <button onClick={reset} style={{
              width:'100%',padding:'6px 10px',
              background:'rgba(16,185,129,.08)',border:'1px solid rgba(16,185,129,.3)',
              borderRadius:4,color:'#10B981',
              fontFamily:"'JetBrains Mono',monospace",fontSize:8.5,cursor:'pointer',
            }}>↺ RESET TO NOMINAL</button>
          )}
        </div>
      </div>

      {/* ══ CENTER ════════════════════════════════════════════════════════ */}
      <div style={{gridColumn:'span 6',display:'flex',flexDirection:'column',gap:10,minHeight:0,overflow:'hidden'}}>

        {/* Orbit canvas */}
        <div style={{flex:'0 0 46%',background:'#0F172A',border:'1px solid #1E293B',borderRadius:7,overflow:'hidden',position:'relative'}} className="scanlines">
          <div style={{position:'absolute',top:9,left:13,zIndex:5,fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:'rgba(0,240,255,.6)',letterSpacing:'.1em'}}>
            ORBITAL TRACK — GROUND PASS SIMULATOR
          </div>
          <OrbitCanvas sysState={sysState}/>
        </div>

        {/* Hardware twin */}
        <div style={{flex:'1 1 0',background:'#0F172A',border:'1px solid #1E293B',borderRadius:7,overflow:'hidden',display:'flex',flexDirection:'column',minHeight:0}}>
          <div style={{padding:'8px 13px 0',fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:'#475569',letterSpacing:'.1em',flexShrink:0}}>SUBSYSTEM HARDWARE TWIN</div>
          <div style={{flex:1,minHeight:0}}>
            <HardwareTwin sysState={sysState} aiState={aiState} wdSec={wdSec} wdMax={tel.wdLimit} gatePass={gatePass}/>
          </div>
        </div>
      </div>

      {/* ══ RIGHT ═════════════════════════════════════════════════════════ */}
      <div style={{gridColumn:'span 3',display:'flex',flexDirection:'column',gap:10,minHeight:0,overflow:'hidden'}}>

        {/* Ghost Futures */}
        <div style={{background:'#0F172A',border:'1px solid #1E293B',borderRadius:7,padding:'10px 10px 10px 12px',flexShrink:0}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,letterSpacing:'.12em',textTransform:'uppercase',color:'#475569',marginBottom:3}}>DIGITAL TWIN "GHOST FUTURES"</div>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7.5,color:'#374151',marginBottom:8}}>PARALLEL SANDBOX SIMULATIONS</div>
          <GhostFutures sysState={sysState} scenario={scenario}/>
        </div>

        {/* XAI Log */}
        <div style={{flex:1,background:'#0F172A',border:'1px solid #1E293B',borderRadius:7,padding:'10px 10px 10px 12px',display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,letterSpacing:'.12em',textTransform:'uppercase',color:'#475569',marginBottom:3,flexShrink:0}}>OBC / AI EXECUTION REPLAY LOG</div>
          <div style={{display:'flex',justifyContent:'space-between',fontFamily:"'JetBrains Mono',monospace",fontSize:7.5,color:'#374151',marginBottom:6,flexShrink:0}}>
            <span>MISSION EVENTS</span>
            <span style={{color:'#475569'}}>{logs.length} entries</span>
          </div>
          {/* Legend */}
          <div style={{display:'flex',flexWrap:'wrap',gap:'4px 8px',marginBottom:6,paddingBottom:6,borderBottom:'1px solid #1E293B',flexShrink:0}}>
            {[['OBC','#4FC3F7'],['WATCHDOG','#F59E0B'],['AI','#A78BFA'],['TWIN','#10B981'],['SAFETY GATE','#F43F5E']].map(([s,c])=>(
              <div key={s} style={{display:'flex',alignItems:'center',gap:3}}>
                <div style={{width:5,height:5,borderRadius:'50%',background:c,flexShrink:0}}/>
                <span style={{fontFamily:"'JetBrains Mono',monospace",fontSize:7,color:c}}>{s}</span>
              </div>
            ))}
          </div>
          <XAILog entries={logs} running={running}/>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
