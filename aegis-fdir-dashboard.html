<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEGIS-TWIN · Orbital FDIR Dashboard</title>

  <!-- CDN Dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Orbitron (display) + Share Tech Mono (mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── ROOT VARIABLES ─────────────────────────────────────────────── */
    :root {
      --bg-shell:    #0B0F19;
      --bg-panel:    #161F30;
      --bg-panel-2:  #1a2540;
      --cyan:        #00E5FF;
      --green:       #00E676;
      --amber:       #FFA726;
      --red:         #ef4444;
      --blue:        #4FC3F7;
      --purple:      #BB86FC;
      --text-dim:    #4a6080;
      --text-muted:  #6b8299;
      --border-dim:  #1e2d45;
    }

    /* ── RESET & BASE ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background-color: var(--bg-shell);
      color: #c8d8e8;
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      overflow: hidden; /* shell fills viewport */
    }

    #root { height: 100%; }

    /* ── BACKGROUND GRID DOT PATTERN ───────────────────────────────── */
    .bg-grid {
      background-color: var(--bg-shell);
      background-image:
        linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── KEYFRAME ANIMATIONS ────────────────────────────────────────── */
    @keyframes glow-pulse {
      0%, 100% {
        box-shadow: 0 0 5px #00E5FF, 0 0 20px rgba(0,229,255,0.4);
        border-color: #00E5FF;
      }
      50% {
        box-shadow: 0 0 15px #00E5FF, 0 0 50px rgba(0,229,255,0.7);
        border-color: #67f5ff;
      }
    }

    @keyframes data-flow {
      0%   { top: 0%;   opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    @keyframes log-slide-in {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @keyframes gate-check-pulse {
      0%, 100% { box-shadow: 0 0 4px var(--amber), 0 0 16px rgba(255,167,38,0.3); border-color: var(--amber); }
      50%       { box-shadow: 0 0 12px var(--amber), 0 0 40px rgba(255,167,38,0.6); border-color: #ffd080; }
    }

    @keyframes gate-pass-glow {
      0%, 100% { box-shadow: 0 0 5px var(--green), 0 0 20px rgba(0,230,118,0.4); border-color: var(--green); }
      50%       { box-shadow: 0 0 15px var(--green), 0 0 50px rgba(0,230,118,0.7); border-color: #67ffb0; }
    }

    @keyframes dot-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.15; }
    }

    @keyframes scanline {
      0%   { transform: translateY(-100%); }
      100% { transform: translateY(100vh); }
    }

    @keyframes header-shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    /* ── AI GLOW CLASS ──────────────────────────────────────────────── */
    .ai-glow {
      animation: glow-pulse 2s ease-in-out infinite;
    }

    /* ── GATE STATUS ANIMATIONS ─────────────────────────────────────── */
    .gate-checking {
      animation: gate-check-pulse 1.2s ease-in-out infinite;
    }
    .gate-passed {
      animation: gate-pass-glow 2s ease-in-out infinite;
    }

    /* ── LOG ENTRY ──────────────────────────────────────────────────── */
    .log-entry {
      animation: log-slide-in 0.3s ease-out forwards;
    }

    /* ── BLINK CURSOR ───────────────────────────────────────────────── */
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }

    /* ── BLINKING DOT ───────────────────────────────────────────────── */
    .dot-anomaly-blink {
      animation: dot-blink 0.7s ease-in-out infinite;
    }

    /* ── SCANLINE OVERLAY (subtle atmosphere) ───────────────────────── */
    .scanline-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        transparent 50%,
        rgba(0, 229, 255, 0.015) 50%
      );
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── DATA FLOW CONNECTOR ────────────────────────────────────────── */
    .data-connector {
      position: relative;
      overflow: hidden;
    }
    .data-dot {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      animation: data-flow 1.8s ease-in-out infinite;
    }
    .data-dot:nth-child(2) { animation-delay: 0.6s; }
    .data-dot:nth-child(3) { animation-delay: 1.2s; }

    /* ── RANGE SLIDER — WEBKIT ──────────────────────────────────────── */
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      background: transparent; /* track set via JS inline style */
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid currentColor;
      background: var(--bg-panel);
      cursor: pointer;
      box-shadow: 0 0 6px currentColor;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      box-shadow: 0 0 12px currentColor;
    }
    input[type=range]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid currentColor;
      background: var(--bg-panel);
      cursor: pointer;
      box-shadow: 0 0 6px currentColor;
    }

    /* ── CUSTOM SCROLLBAR (log panel) ───────────────────────────────── */
    .log-scroll::-webkit-scrollbar { width: 4px; }
    .log-scroll::-webkit-scrollbar-track { background: #0d1626; }
    .log-scroll::-webkit-scrollbar-thumb {
      background: rgba(0,229,255,0.3);
      border-radius: 2px;
    }
    .log-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(0,229,255,0.6);
    }

    /* ── PANEL HEADER ACCENT LINE ───────────────────────────────────── */
    .panel-accent-cyan   { border-top: 2px solid var(--cyan); }
    .panel-accent-blue   { border-top: 2px solid var(--blue); }
    .panel-accent-purple { border-top: 2px solid var(--purple); }

    /* ── CHIP TAGS ──────────────────────────────────────────────────── */
    .chip {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.06em;
      padding: 2px 6px;
      border-radius: 2px;
      border: 1px solid currentColor;
      opacity: 0.75;
    }

    /* ── ORBITRON FONT UTILITY ──────────────────────────────────────── */
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-mono-tech { font-family: 'Share Tech Mono', monospace; }

    /* ── TELEMETRY TABLE ────────────────────────────────────────────── */
    .telem-table td { padding: 3px 0; }
    .telem-table td:first-child { color: var(--text-muted); width: 72px; }

    /* ── HEADER TITLE SHIMMER ───────────────────────────────────────── */
    .title-shimmer {
      background: linear-gradient(
        90deg,
        var(--cyan) 0%,
        #67f5ff 30%,
        var(--cyan) 60%,
        #00a8c0 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: header-shimmer 4s linear infinite;
    }

    /* ── WATCHDOG SVG ───────────────────────────────────────────────── */
    .watchdog-ring {
      transition: stroke 0.5s ease;
    }

    /* ── BUTTON STATES ──────────────────────────────────────────────── */
    .inject-btn {
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }
    .inject-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }
    .inject-btn:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(239,68,68,0.5), 0 4px 12px rgba(0,0,0,0.4);
    }
    .inject-btn:not(:disabled):active {
      transform: translateY(0);
    }
    .inject-btn:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }
  </style>
</head>
<body class="bg-grid">

  <div id="root"></div>

  <script type="text/babel">
    // ─────────────────────────────────────────────────────────────────────────
    // AEGIS-TWIN FDIR Dashboard — React 18 / Babel Standalone / Tailwind CDN
    // Single-file aerospace hackathon prototype
    // ─────────────────────────────────────────────────────────────────────────
    const { useState, useEffect, useRef, useCallback } = React;

    // ── CONSTANTS ────────────────────────────────────────────────────────────
    const VOLTAGE_MIN = 0;
    const VOLTAGE_MAX = 10;
    const TEMP_MIN    = -40;
    const TEMP_MAX    = 100;

    // ── UTILITY HELPERS ──────────────────────────────────────────────────────

    /** Returns colour token for bus voltage value */
    function voltageColor(v) {
      if (v >= 5)  return '#00E676';
      if (v >= 4)  return '#FFA726';
      return '#ef4444';
    }

    /** Returns colour token for battery temperature */
    function tempColor(t) {
      if (t < 60) return '#00E676';
      if (t <= 80) return '#FFA726';
      return '#ef4444';
    }

    /** Format a Date to HH:MM:SS UTC */
    function fmtUTC(d) {
      return d.toUTCString().split(' ')[4] + ' UTC';
    }

    /** Promise-wrapped setTimeout */
    function delay(ms) {
      return new Promise(res => setTimeout(res, ms));
    }

    /** Build a slider track CSS background (filled left of thumb) */
    function sliderTrack(val, min, max, color) {
      const pct = ((val - min) / (max - min)) * 100;
      return `linear-gradient(to right, ${color} 0%, ${color} ${pct}%, #1e2d45 ${pct}%, #1e2d45 100%)`;
    }


    // ─────────────────────────────────────────────────────────────────────────
    // SUB-COMPONENTS
    // ─────────────────────────────────────────────────────────────────────────

    // ── UTC CLOCK ────────────────────────────────────────────────────────────
    function UtcClock() {
      const [time, setTime] = useState(fmtUTC(new Date()));
      useEffect(() => {
        const id = setInterval(() => setTime(fmtUTC(new Date())), 1000);
        return () => clearInterval(id);
      }, []);
      return (
        <div className="font-mono-tech text-xs tracking-widest"
             style={{ color: '#00E5FF' }}>
          {time}
        </div>
      );
    }

    // ── HEADER ───────────────────────────────────────────────────────────────
    function Header({ systemStatus, aiPowerState }) {
      const statusConfig = {
        NOMINAL:    { label: 'NOMINAL',    color: '#00E676', blink: false },
        ANOMALY:    { label: 'ANOMALY',    color: '#ef4444', blink: true  },
        RECOVERING: { label: 'RECOVERING', color: '#FFA726', blink: false },
      };
      const aiConfig = {
        DEEP_SLEEP: { label: 'DEEP SLEEP', color: '#4a6080', glow: false },
        ACTIVE:     { label: 'ACTIVE',     color: '#00E5FF', glow: true  },
      };
      const sc = statusConfig[systemStatus];
      const ac = aiConfig[aiPowerState];

      return (
        <header className="relative flex items-center justify-between px-6 py-3 scanline-overlay"
                style={{
                  background: 'rgba(11,15,25,0.95)',
                  backdropFilter: 'blur(12px)',
                  borderBottom: '1px solid rgba(0,229,255,0.25)',
                  boxShadow: '0 1px 0 rgba(0,229,255,0.1), 0 4px 20px rgba(0,0,0,0.5)',
                  zIndex: 10,
                  minHeight: '60px',
                }}>

          {/* LEFT: Logo + Title */}
          <div className="flex items-center gap-3">
            {/* Hexagon SVG icon */}
            <svg width="36" height="36" viewBox="0 0 36 36">
              <polygon points="18,2 33,10 33,26 18,34 3,26 3,10"
                       fill="none" stroke="#00E5FF" strokeWidth="1.5"
                       style={{ filter: 'drop-shadow(0 0 4px #00E5FF)' }}/>
              <polygon points="18,7 28,12.5 28,23.5 18,29 8,23.5 8,12.5"
                       fill="rgba(0,229,255,0.08)" stroke="#00E5FF" strokeWidth="0.5"/>
              {/* inner cross */}
              <line x1="18" y1="10" x2="18" y2="26" stroke="#00E5FF" strokeWidth="0.8" opacity="0.6"/>
              <line x1="10" y1="18" x2="26" y2="18" stroke="#00E5FF" strokeWidth="0.8" opacity="0.6"/>
              <circle cx="18" cy="18" r="2" fill="#00E5FF"
                      style={{ filter: 'drop-shadow(0 0 3px #00E5FF)' }}/>
            </svg>
            <div>
              <div className="font-orbitron font-black text-xl leading-none title-shimmer"
                   style={{ letterSpacing: '0.12em' }}>
                AEGIS-TWIN
              </div>
              <div className="font-mono-tech text-xs leading-tight mt-0.5"
                   style={{ color: '#4a6080', letterSpacing: '0.18em' }}>
                ASYMMETRIC FDIR ARCHITECTURE
              </div>
            </div>
          </div>

          {/* CENTER-RIGHT: Status badges */}
          <div className="flex items-center gap-6">

            {/* System Status */}
            <div className="flex flex-col items-end gap-1">
              <div className="font-mono-tech text-xs" style={{ color: '#4a6080', letterSpacing: '0.14em' }}>
                SYSTEM STATUS
              </div>
              <div className="flex items-center gap-2 px-3 py-1 rounded-sm"
                   style={{
                     background: `rgba(0,0,0,0.4)`,
                     border: `1px solid ${sc.color}44`,
                   }}>
                <span className={`inline-block w-2 h-2 rounded-full ${sc.blink ? 'dot-anomaly-blink' : ''}`}
                      style={{
                        backgroundColor: sc.color,
                        boxShadow: `0 0 6px ${sc.color}`,
                      }}/>
                <span className="font-orbitron text-xs font-semibold" style={{ color: sc.color, letterSpacing: '0.1em' }}>
                  {sc.label}
                </span>
              </div>
            </div>

            {/* Divider */}
            <div style={{ width: 1, height: 36, background: '#1e2d45' }}/>

            {/* AI Power State */}
            <div className="flex flex-col items-end gap-1">
              <div className="font-mono-tech text-xs" style={{ color: '#4a6080', letterSpacing: '0.14em' }}>
                AI POWER STATE
              </div>
              <div className="flex items-center gap-2 px-3 py-1 rounded-sm"
                   style={{
                     background: `rgba(0,0,0,0.4)`,
                     border: `1px solid ${ac.color}44`,
                   }}>
                <span className="inline-block w-2 h-2 rounded-full"
                      style={{
                        backgroundColor: ac.color,
                        boxShadow: ac.glow ? `0 0 8px ${ac.color}, 0 0 16px ${ac.color}` : 'none',
                        animation: ac.glow ? 'dot-blink 1.5s ease-in-out infinite' : 'none',
                      }}/>
                <span className="font-orbitron text-xs font-semibold" style={{ color: ac.color, letterSpacing: '0.1em' }}>
                  {ac.label}
                </span>
              </div>
            </div>

            {/* Divider */}
            <div style={{ width: 1, height: 36, background: '#1e2d45' }}/>

            {/* UTC Clock */}
            <UtcClock />
          </div>
        </header>
      );
    }


    // ── SLIDER CARD ──────────────────────────────────────────────────────────
    function SliderCard({ label, value, min, max, unit, color, onChange, disabled, formatVal }) {
      const trackBg = sliderTrack(value, min, max, color);
      const display = formatVal ? formatVal(value) : value.toFixed(1);
      return (
        <div className="p-4 rounded-sm"
             style={{ background: '#0d1626', border: '1px solid #1e2d45' }}>
          <div className="flex items-center justify-between mb-3">
            <span className="font-mono-tech text-xs tracking-widest" style={{ color: '#4a6080' }}>
              {label}
            </span>
            <span className="font-orbitron text-xl font-bold" style={{ color }}>
              {display}<span className="text-sm ml-1 font-light opacity-60">{unit}</span>
            </span>
          </div>
          <input
            type="range"
            min={min}
            max={max}
            step="0.1"
            value={value}
            disabled={disabled}
            onChange={e => onChange(parseFloat(e.target.value))}
            style={{
              background: trackBg,
              color, /* sets thumb border via currentColor */
            }}
          />
          <div className="flex justify-between mt-1">
            <span className="font-mono-tech text-xs" style={{ color: '#2a3a55' }}>{min}{unit}</span>
            <span className="font-mono-tech text-xs" style={{ color: '#2a3a55' }}>{max}{unit}</span>
          </div>
        </div>
      );
    }


    // ── LEFT PANEL: THE ARENA ────────────────────────────────────────────────
    function LeftPanel({ busVoltage, batteryTemp, isRunning, aiPowerState,
                         systemStatus, onVoltageChange, onTempChange, onInject }) {
      const vColor = voltageColor(busVoltage);
      const tColor = tempColor(batteryTemp);
      const aiPwr  = aiPowerState === 'ACTIVE' ? '~800mW' : '0W';

      return (
        <div className="flex flex-col h-full p-4 gap-4 overflow-y-auto panel-accent-blue"
             style={{ background: '#161F30', borderRadius: 0 }}>

          {/* Panel Header */}
          <div className="flex items-center gap-2 pb-2"
               style={{ borderBottom: '1px solid #1e2d45' }}>
            <div className="w-1 h-5 rounded-sm" style={{ background: '#4FC3F7' }}/>
            <span className="font-orbitron text-xs font-semibold tracking-widest" style={{ color: '#4FC3F7' }}>
              THE ARENA
            </span>
            <span className="font-mono-tech text-xs ml-auto" style={{ color: '#2a3a55' }}>JUDGE CONTROLS</span>
          </div>

          {/* Bus Voltage Slider */}
          <SliderCard
            label="BUS VOLTAGE"
            value={busVoltage}
            min={VOLTAGE_MIN}
            max={VOLTAGE_MAX}
            unit="V"
            color={vColor}
            onChange={onVoltageChange}
            disabled={isRunning}
          />

          {/* Battery Temp Slider */}
          <SliderCard
            label="BATTERY TEMP"
            value={batteryTemp}
            min={TEMP_MIN}
            max={TEMP_MAX}
            unit="°C"
            color={tColor}
            onChange={onTempChange}
            disabled={isRunning}
            formatVal={v => (v >= 0 ? '+' : '') + v.toFixed(1)}
          />

          {/* INJECT Button */}
          <button
            className="inject-btn w-full py-4 rounded-sm font-orbitron font-bold text-sm tracking-widest"
            disabled={isRunning}
            onClick={onInject}
            style={{
              background: isRunning
                ? 'linear-gradient(135deg, #2a1a1a 0%, #1a1020 100%)'
                : 'linear-gradient(135deg, #7f1d1d 0%, #991b1b 50%, #7f1d1d 100%)',
              border: `1px solid ${isRunning ? '#3a1a1a' : '#ef444477'}`,
              color: isRunning ? '#7a3030' : '#ef4444',
              letterSpacing: '0.12em',
              boxShadow: isRunning ? 'none' : '0 0 12px rgba(239,68,68,0.25)',
            }}>
            {isRunning ? (
              <span>⟳ FDIR SEQUENCE RUNNING...</span>
            ) : (
              <span>⚠ INJECT CRITICAL ANOMALY</span>
            )}
          </button>

          {/* Real-time Telemetry Table */}
          <div className="p-3 rounded-sm"
               style={{ background: '#0d1626', border: '1px solid #1e2d45' }}>
            <div className="font-mono-tech text-xs mb-3" style={{ color: '#4a6080', letterSpacing: '0.12em' }}>
              REAL-TIME TELEMETRY
            </div>
            <table className="telem-table w-full">
              <tbody className="font-mono-tech text-xs">
                <tr>
                  <td>BUS V</td>
                  <td>
                    <span style={{ color: vColor }}>
                      {busVoltage.toFixed(2)} V
                    </span>
                  </td>
                  <td className="text-right">
                    <StatusDot color={vColor}/>
                  </td>
                </tr>
                <tr>
                  <td>BAT T</td>
                  <td>
                    <span style={{ color: tColor }}>
                      {(batteryTemp >= 0 ? '+' : '') + batteryTemp.toFixed(1)} °C
                    </span>
                  </td>
                  <td className="text-right">
                    <StatusDot color={tColor}/>
                  </td>
                </tr>
                <tr>
                  <td>AI PWR</td>
                  <td>
                    <span style={{ color: aiPowerState === 'ACTIVE' ? '#00E5FF' : '#4a6080' }}>
                      {aiPwr}
                    </span>
                  </td>
                  <td className="text-right">
                    <StatusDot color={aiPowerState === 'ACTIVE' ? '#00E5FF' : '#2a3a55'}/>
                  </td>
                </tr>
                <tr>
                  <td>STATUS</td>
                  <td>
                    <span style={{
                      color: systemStatus === 'NOMINAL' ? '#00E676'
                           : systemStatus === 'ANOMALY' ? '#ef4444' : '#FFA726'
                    }}>
                      {systemStatus}
                    </span>
                  </td>
                  <td className="text-right">
                    <StatusDot color={
                      systemStatus === 'NOMINAL' ? '#00E676'
                    : systemStatus === 'ANOMALY' ? '#ef4444' : '#FFA726'
                    }/>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          {/* Spacer */}
          <div className="flex-1"/>

          {/* Mission info strip */}
          <div className="font-mono-tech text-xs text-center py-2"
               style={{ color: '#2a3a55', borderTop: '1px solid #1e2d45', letterSpacing: '0.1em' }}>
            MISSION ELAPSED · ORBIT-7 · LEO-540km
          </div>
        </div>
      );
    }

    function StatusDot({ color }) {
      return (
        <span className="inline-block w-1.5 h-1.5 rounded-full"
              style={{ backgroundColor: color, boxShadow: `0 0 4px ${color}` }}/>
      );
    }


    // ── WATCHDOG RING ────────────────────────────────────────────────────────
    function WatchdogRing({ secondsLeft }) {
      const total = 10;
      const pct   = secondsLeft / total;
      const radius = 36;
      const circ   = 2 * Math.PI * radius;
      const dash   = pct * circ;
      const ringColor = pct > 0.5 ? '#00E676' : pct > 0.25 ? '#FFA726' : '#ef4444';

      return (
        <div className="flex flex-col items-center gap-1">
          <div className="relative">
            <svg width="88" height="88" viewBox="0 0 88 88">
              {/* background track */}
              <circle cx="44" cy="44" r={radius} fill="none"
                      stroke="#1e2d45" strokeWidth="4"/>
              {/* progress arc */}
              <circle cx="44" cy="44" r={radius} fill="none"
                      className="watchdog-ring"
                      stroke={ringColor}
                      strokeWidth="4"
                      strokeLinecap="round"
                      strokeDasharray={`${dash} ${circ}`}
                      strokeDashoffset="0"
                      transform="rotate(-90 44 44)"
                      style={{ filter: `drop-shadow(0 0 4px ${ringColor})` }}/>
              {/* center text */}
              <text x="44" y="44" textAnchor="middle" dominantBaseline="central"
                    fontFamily="Orbitron, sans-serif" fontWeight="700" fontSize="18"
                    fill={ringColor}>
                {secondsLeft}
              </text>
            </svg>
          </div>
          <div className="font-mono-tech text-xs text-center" style={{ color: '#4a6080', letterSpacing: '0.1em' }}>
            WATCHDOG
          </div>
          <div className="font-mono-tech text-xs text-center"
               style={{ color: ringColor, letterSpacing: '0.1em' }}>
            {secondsLeft}s LEFT
          </div>
        </div>
      );
    }


    // ── DATA FLOW CONNECTOR LINE ─────────────────────────────────────────────
    function ConnectorLine({ label, active, color = '#00E5FF' }) {
      return (
        <div className="flex flex-col items-center" style={{ height: '44px' }}>
          {/* line + label */}
          <div className="font-mono-tech text-xs mb-1" style={{ color: '#2a3a55', letterSpacing: '0.14em' }}>
            {label}
          </div>
          {/* animated wire */}
          <div className="data-connector flex-1" style={{ width: '2px', background: active ? color + '33' : '#1e2d45' }}>
            {active && <>
              <div className="data-dot" style={{ background: color, boxShadow: `0 0 4px ${color}` }}/>
              <div className="data-dot" style={{ background: color, boxShadow: `0 0 4px ${color}` }}/>
              <div className="data-dot" style={{ background: color, boxShadow: `0 0 4px ${color}` }}/>
            </>}
          </div>
        </div>
      );
    }


    // ── ARCH NODE BLOCK ──────────────────────────────────────────────────────
    function ArchNode({ title, subtitle, chips, color, borderColor, glowClass, extraStyle, icon }) {
      return (
        <div className={`p-3 rounded-sm ${glowClass || ''}`}
             style={{
               background: '#0d1626',
               border: `1px solid ${borderColor || color}`,
               ...extraStyle,
             }}>
          <div className="flex items-center gap-2 mb-1">
            {icon && <span style={{ fontSize: '14px' }}>{icon}</span>}
            <span className="font-orbitron text-xs font-bold tracking-widest" style={{ color }}>
              {title}
            </span>
          </div>
          <div className="font-mono-tech text-xs mb-2"
               style={{ color: '#4a6080', fontSize: '9px', letterSpacing: '0.1em' }}>
            {subtitle}
          </div>
          <div className="flex flex-wrap gap-1">
            {chips.map(c => (
              <span key={c} className="chip" style={{ color, borderColor: `${color}55` }}>
                {c}
              </span>
            ))}
          </div>
        </div>
      );
    }


    // ── CENTER PANEL: HARDWARE TWIN DIAGRAM ──────────────────────────────────
    function CenterPanel({ aiPowerState, safetyGateStatus, watchdogSec }) {
      const aiActive  = aiPowerState === 'ACTIVE';
      const busActive = true; // OBC control bus always active
      const propActive = aiActive; // proposal channel only when AI is awake

      // Safety gate colours
      const gateStyleMap = {
        STANDBY:  { color: '#4a6080', borderColor: '#2a3a55', glowClass: '' },
        CHECKING: { color: '#FFA726', borderColor: '#FFA726', glowClass: 'gate-checking' },
        PASSED:   { color: '#00E676', borderColor: '#00E676', glowClass: 'gate-passed' },
      };
      const gate = gateStyleMap[safetyGateStatus];

      return (
        <div className="flex flex-col h-full p-4 gap-3 panel-accent-cyan"
             style={{ background: '#161F30' }}>

          {/* Panel Header */}
          <div className="flex items-center gap-2 pb-2"
               style={{ borderBottom: '1px solid #1e2d45' }}>
            <div className="w-1 h-5 rounded-sm" style={{ background: '#00E5FF' }}/>
            <span className="font-orbitron text-xs font-semibold tracking-widest" style={{ color: '#00E5FF' }}>
              HARDWARE TWIN
            </span>
            <span className="font-mono-tech text-xs ml-auto" style={{ color: '#2a3a55' }}>ARCH DIAGRAM</span>
          </div>

          {/* Main diagram + optional watchdog sidebar */}
          <div className="flex gap-4 flex-1 min-h-0">

            {/* Diagram column */}
            <div className="flex flex-col items-center flex-1 gap-0 justify-center">

              {/* MASTER OBC */}
              <ArchNode
                title="MASTER OBC — C++ RTOS"
                subtitle="DETERMINISTIC AUTHORITY · WATCHDOG · WHITELIST"
                chips={['C++ RTOS', 'BARE-METAL', 'WATCHDOG']}
                color="#4FC3F7"
                borderColor="#4FC3F7"
                extraStyle={{ width: '100%', boxShadow: '0 0 8px rgba(79,195,247,0.2)' }}
              />

              <ConnectorLine label="CONTROL BUS" active={busActive} color="#4FC3F7"/>

              {/* SAFETY GATE */}
              <ArchNode
                icon="🛡"
                title="SAFETY GATE"
                subtitle="WHITELIST VERIFY · CONSTRAINT CHECK · AUTHORIZE"
                chips={['WHITELIST', 'CONSTRAINT', 'APPROVE']}
                color={gate.color}
                borderColor={gate.borderColor}
                glowClass={gate.glowClass}
                extraStyle={{ width: '100%', position: 'relative' }}
              />

              {/* Safety gate status badge */}
              <div className="w-full flex justify-end -mt-1 mb-1 pr-1">
                <span className="font-mono-tech text-xs px-2 py-0.5 rounded-sm"
                      style={{
                        background: `${gate.color}22`,
                        border: `1px solid ${gate.color}55`,
                        color: gate.color,
                        fontSize: '9px',
                        letterSpacing: '0.12em',
                      }}>
                  {safetyGateStatus}
                </span>
              </div>

              <ConnectorLine label="PROPOSAL CHANNEL" active={propActive} color="#00E5FF"/>

              {/* EDGE-AI COPROCESSOR */}
              <ArchNode
                title="EDGE-AI COPROCESSOR"
                subtitle="NEURAL INFERENCE · TELEMETRY ANALYSIS · PROPOSE ONLY"
                chips={['TFLite', 'INT8', 'ISOLAT.']}
                color={aiActive ? '#00E5FF' : '#4a6080'}
                borderColor={aiActive ? '#00E5FF' : '#2a3a55'}
                glowClass={aiActive ? 'ai-glow' : ''}
                extraStyle={{ width: '100%' }}
              />

              {/* AI state label */}
              <div className="mt-2 font-mono-tech text-xs text-center"
                   style={{ color: aiActive ? '#00E5FF' : '#2a3a55', letterSpacing: '0.14em' }}>
                {aiActive ? '● ACTIVE — RUNNING INFERENCE' : '○ DEEP SLEEP — 0W DRAW'}
              </div>
            </div>

            {/* Watchdog sidebar — only when AI is active */}
            {aiActive && (
              <div className="flex flex-col items-center justify-center gap-4 pl-2"
                   style={{ borderLeft: '1px solid #1e2d45', width: '110px' }}>
                <WatchdogRing secondsLeft={watchdogSec}/>
                <div className="p-2 rounded-sm w-full"
                     style={{ background: '#0d1626', border: '1px solid #1e2d45' }}>
                  <div className="font-mono-tech text-center"
                       style={{ color: '#00E5FF', fontSize: '10px', letterSpacing: '0.1em' }}>
                    ~800mW
                  </div>
                  <div className="font-mono-tech text-center"
                       style={{ color: '#4a6080', fontSize: '9px', letterSpacing: '0.1em' }}>
                    DUTY ON
                  </div>
                </div>
              </div>
            )}
            {!aiActive && (
              <div className="flex flex-col items-center justify-center gap-2 pl-2"
                   style={{ borderLeft: '1px solid #1e2d45', width: '110px' }}>
                <div className="p-2 rounded-sm w-full"
                     style={{ background: '#0d1626', border: '1px solid #1e2d45' }}>
                  <div className="font-mono-tech text-center"
                       style={{ color: '#2a3a55', fontSize: '10px', letterSpacing: '0.1em' }}>
                    0W
                  </div>
                  <div className="font-mono-tech text-center"
                       style={{ color: '#2a3a55', fontSize: '9px', letterSpacing: '0.1em' }}>
                    DUTY OFF
                  </div>
                </div>
                <div className="font-mono-tech text-center w-full"
                     style={{ color: '#2a3a55', fontSize: '9px', letterSpacing: '0.08em' }}>
                  WATCHDOG<br/>DISARMED
                </div>
              </div>
            )}
          </div>

          {/* Legend */}
          <div style={{ borderTop: '1px solid #1e2d45' }} className="pt-3">
            <div className="grid grid-cols-3 gap-2">
              {[
                { color: '#4FC3F7', label: 'OBC',         sub: 'Deterministic authority' },
                { color: safetyGateStatus === 'PASSED' ? '#00E676' : safetyGateStatus === 'CHECKING' ? '#FFA726' : '#4a6080',
                  label: 'SAFETY GATE', sub: 'Whitelist enforcement' },
                { color: aiActive ? '#00E5FF' : '#4a6080', label: 'AI COPR.', sub: 'Proposal-only isolation' },
              ].map(l => (
                <div key={l.label} className="flex flex-col gap-1">
                  <div className="flex items-center gap-1.5">
                    <div className="w-2 h-2 rounded-sm flex-shrink-0"
                         style={{ background: l.color, boxShadow: `0 0 4px ${l.color}` }}/>
                    <span className="font-orbitron text-xs font-semibold" style={{ color: l.color, fontSize: '8px', letterSpacing: '0.1em' }}>
                      {l.label}
                    </span>
                  </div>
                  <span className="font-mono-tech" style={{ color: '#2a3a55', fontSize: '8px' }}>
                    {l.sub}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }


    // ── RIGHT PANEL: FDIR EXECUTION LOG ──────────────────────────────────────
    function RightPanel({ logEntries, isRunning }) {
      const scrollRef = useRef(null);

      // Auto-scroll to bottom on new entries
      useEffect(() => {
        if (scrollRef.current) {
          scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
        }
      }, [logEntries]);

      // Source → colour mapping
      const sourceColors = {
        'OBC':  '#4FC3F7',
        'AI':   '#00E5FF',
        'SYS':  '#00E676',
        'WARN': '#FFA726',
        '━━━':  '#BB86FC',
      };

      return (
        <div className="flex flex-col h-full p-4 gap-3 panel-accent-purple"
             style={{ background: '#161F30' }}>

          {/* Panel Header */}
          <div className="flex items-center gap-2 pb-2"
               style={{ borderBottom: '1px solid #1e2d45' }}>
            <div className="w-1 h-5 rounded-sm" style={{ background: '#BB86FC' }}/>
            <span className="font-orbitron text-xs font-semibold tracking-widest" style={{ color: '#BB86FC' }}>
              FDIR EXECUTION LOG
            </span>
            <span className="font-mono-tech text-xs ml-auto" style={{ color: '#2a3a55' }}>XAI TRACE</span>
            {/* Blinking cursor while running */}
            {isRunning && (
              <span className="font-mono-tech cursor-blink ml-1"
                    style={{ color: '#00E5FF', fontSize: '14px' }}>▮</span>
            )}
          </div>

          {/* Log scroll area */}
          <div ref={scrollRef}
               className="log-scroll flex-1 overflow-y-auto"
               style={{ minHeight: 0 }}>

            {logEntries.length === 0 ? (
              /* Empty state */
              <div className="flex flex-col items-center justify-center h-full gap-3"
                   style={{ color: '#2a3a55' }}>
                <div className="font-orbitron text-2xl">◌</div>
                <div className="font-mono-tech text-xs tracking-widest text-center">
                  AWAITING ANOMALY INJECTION
                </div>
                <div className="font-mono-tech text-xs text-center" style={{ color: '#1e2d45' }}>
                  Inject a critical anomaly from<br/>The Arena panel to begin FDIR trace.
                </div>
              </div>
            ) : (
              /* Log entries */
              <div className="flex flex-col gap-0.5">
                {logEntries.map((entry, i) => {
                  const srcColor = sourceColors[entry.source] || '#c8d8e8';
                  const isDivider = entry.source === '━━━';
                  return (
                    <div key={entry.id}
                         className="log-entry flex gap-0 items-start"
                         style={{ borderLeft: `2px solid ${srcColor}`, paddingLeft: '8px', marginBottom: isDivider ? '2px' : '0' }}>
                      {/* Timestamp */}
                      <span className="font-mono-tech flex-shrink-0 mr-2"
                            style={{ color: '#2a3a55', fontSize: '10px', lineHeight: '18px', minWidth: '72px' }}>
                        [{entry.ts}]
                      </span>
                      {/* Source tag */}
                      <span className="font-mono-tech flex-shrink-0 mr-2 font-bold"
                            style={{ color: srcColor, fontSize: '10px', lineHeight: '18px', minWidth: '36px' }}>
                        [{entry.source}]
                      </span>
                      {/* Message */}
                      <span className="font-mono-tech"
                            style={{
                              color: isDivider ? srcColor : '#a0b8d0',
                              fontSize: '10px',
                              lineHeight: '18px',
                              wordBreak: 'break-all',
                            }}>
                        {entry.msg}
                      </span>
                    </div>
                  );
                })}
                {/* trailing cursor while running */}
                {isRunning && (
                  <div className="flex gap-0 items-center" style={{ paddingLeft: '10px' }}>
                    <span className="font-mono-tech cursor-blink" style={{ color: '#00E5FF', fontSize: '10px' }}>▮</span>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Footer strip */}
          <div style={{ borderTop: '1px solid #1e2d45' }} className="pt-2">
            <div className="flex items-center justify-between">
              <span className="font-mono-tech text-xs" style={{ color: '#2a3a55' }}>
                {logEntries.length} EVENTS LOGGED
              </span>
              <span className="font-mono-tech text-xs" style={{ color: isRunning ? '#00E5FF' : '#2a3a55' }}>
                {isRunning ? '● SEQUENCE ACTIVE' : '○ IDLE'}
              </span>
            </div>
          </div>
        </div>
      );
    }


    // ─────────────────────────────────────────────────────────────────────────
    // MAIN APP COMPONENT
    // ─────────────────────────────────────────────────────────────────────────
    function App() {

      // ── STATE ─────────────────────────────────────────────────────────────
      const [busVoltage,     setBusVoltage]     = useState(7.5);
      const [batteryTemp,    setBatteryTemp]    = useState(25.0);
      const [systemStatus,   setSystemStatus]   = useState('NOMINAL');   // 'NOMINAL' | 'ANOMALY' | 'RECOVERING'
      const [aiPowerState,   setAiPowerState]   = useState('DEEP_SLEEP');// 'DEEP_SLEEP' | 'ACTIVE'
      const [safetyGateStatus, setSafetyGateStatus] = useState('STANDBY'); // 'STANDBY' | 'CHECKING' | 'PASSED'
      const [isRunning,      setIsRunning]      = useState(false);
      const [logEntries,     setLogEntries]     = useState([]);
      const [watchdogSec,    setWatchdogSec]    = useState(10);

      // Entry ID counter (ref so doesn't cause re-renders)
      const entryIdRef = useRef(0);

      // ── WATCHDOG EFFECT ──────────────────────────────────────────────────
      // Starts countdown when AI becomes ACTIVE; clears when it returns to DEEP_SLEEP
      useEffect(() => {
        if (aiPowerState === 'ACTIVE') {
          setWatchdogSec(10);
          const id = setInterval(() => {
            setWatchdogSec(prev => {
              if (prev <= 1) { clearInterval(id); return 0; }
              return prev - 1;
            });
          }, 1000);
          return () => clearInterval(id);
        } else {
          setWatchdogSec(10); // reset for next run
        }
      }, [aiPowerState]);

      // ── LOG HELPER ───────────────────────────────────────────────────────
      const appendLog = useCallback((source, msg) => {
        const now  = new Date();
        const ts   = now.toUTCString().split(' ')[4];
        const id   = ++entryIdRef.current;
        setLogEntries(prev => [...prev, { id, ts, source, msg }]);
      }, []);

      // ── INJECT SEQUENCE ──────────────────────────────────────────────────
      const handleInject = useCallback(async () => {
        if (isRunning) return;
        setIsRunning(true);

        // ── t=0ms: Set anomaly conditions ────────────────────────────────
        setBatteryTemp(85);
        setBusVoltage(3.2);
        setSystemStatus('ANOMALY');

        // ── t=400ms ──────────────────────────────────────────────────────
        await delay(400);
        appendLog('WARN', 'Thermal anomaly detected — Battery Temp: 85°C | Bus Voltage: 3.2V. Envelope breached.');

        // ── t=1100ms ─────────────────────────────────────────────────────
        await delay(700);
        appendLog('OBC', 'Initiating FDIR protocol. AI Coprocessor wake interrupt asserted.');
        setAiPowerState('ACTIVE');

        // ── t=2300ms ─────────────────────────────────────────────────────
        await delay(1200);
        appendLog('OBC', 'Watchdog armed — 10 second decision window opened.');

        // ── t=3700ms ─────────────────────────────────────────────────────
        await delay(1400);
        appendLog('AI', 'Boot complete. Ingesting telemetry snapshot...');

        // ── t=5100ms ─────────────────────────────────────────────────────
        await delay(1400);
        appendLog('AI', 'Diagnostics complete. 94.2% confidence → ADCS Thermal Latch-up (Class-3 Event).');

        // ── t=6400ms ─────────────────────────────────────────────────────
        await delay(1300);
        appendLog('AI', 'Root cause: Stuck-at-1 fault on thermal regulation bus. Propagation risk: HIGH.');

        // ── t=7500ms ─────────────────────────────────────────────────────
        await delay(1100);
        appendLog('AI', 'Proposing Mitigation Template #14: [HARD RESET — ADCS Bus + Thermal Venting Sequence].');

        // ── t=8300ms ─────────────────────────────────────────────────────
        await delay(800);
        setSafetyGateStatus('CHECKING');
        appendLog('OBC', 'Template #14 received. Initiating safety gate evaluation...');

        // ── t=9100ms ─────────────────────────────────────────────────────
        await delay(800);
        appendLog('OBC', '  ✓ Template #14 is on whitelist (pre-approved by mission engineers)');

        // ── t=9600ms ─────────────────────────────────────────────────────
        await delay(500);
        appendLog('OBC', '  ✓ Voltage constraint: 3.2V → predicted recovery 6.8V (within 5V floor)');

        // ── t=10100ms ────────────────────────────────────────────────────
        await delay(500);
        appendLog('OBC', '  ✓ Thermal constraint: 85°C → predicted 38°C (within ±60°C limit)');

        // ── t=10600ms ────────────────────────────────────────────────────
        await delay(500);
        appendLog('OBC', '  ✓ Timing: 7.1s elapsed < 10s watchdog window');

        // ── t=11400ms ────────────────────────────────────────────────────
        await delay(800);
        setSafetyGateStatus('PASSED');
        appendLog('SYS', 'SAFETY GATE PASSED — Template #14 AUTHORIZED for execution.');

        // ── t=12200ms ────────────────────────────────────────────────────
        await delay(800);
        setSystemStatus('RECOVERING');
        appendLog('OBC', 'Executing Template #14. Asserting ADCS hard reset line...');

        // ── t=13400ms ─ Animate sliders back gradually ───────────────────
        await delay(1200);
        appendLog('OBC', 'Monitoring recovery... Voltage rising. Temperature decreasing.');

        // Animate voltage 3.2 → 7.5 and temp 85 → 32 over ~2s
        // setInterval every 150ms: about 13-14 steps
        await new Promise(resolve => {
          let step = 0;
          const voltStart = 3.2, voltEnd = 7.5;
          const tempStart = 85,  tempEnd = 32;
          const steps     = 14;
          const id = setInterval(() => {
            step++;
            const progress = step / steps;
            const eased    = 1 - Math.pow(1 - progress, 2); // ease-out quad
            setBusVoltage(+(voltStart + (voltEnd - voltStart) * eased).toFixed(2));
            setBatteryTemp(+(tempStart + (tempEnd - tempStart) * eased).toFixed(1));
            if (step >= steps) {
              clearInterval(id);
              resolve();
            }
          }, 150);
        });

        // ── t=15400ms ────────────────────────────────────────────────────
        await delay(400); // small buffer after animation
        setSystemStatus('NOMINAL');
        setAiPowerState('DEEP_SLEEP');
        setSafetyGateStatus('STANDBY');
        appendLog('OBC', 'Recovery confirmed. Bus Voltage: 7.5V | Temp: 32°C. Anomaly cleared.');

        // ── t=15800ms ────────────────────────────────────────────────────
        await delay(400);
        appendLog('OBC', 'Returning AI to Deep Sleep (0W). Watchdog disarmed.');

        // ── t=16200ms ────────────────────────────────────────────────────
        await delay(400);
        appendLog('SYS', 'FDIR cycle complete. Mission integrity maintained. Status: NOMINAL.');

        // ── t=16600ms ────────────────────────────────────────────────────
        await delay(400);
        appendLog('━━━', '━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        setIsRunning(false);

      }, [isRunning, appendLog]);


      // ── RENDER ────────────────────────────────────────────────────────────
      return (
        <div className="flex flex-col h-screen overflow-hidden"
             style={{ background: 'var(--bg-shell)' }}>

          {/* HEADER */}
          <Header systemStatus={systemStatus} aiPowerState={aiPowerState}/>

          {/* MAIN 3-COLUMN GRID */}
          <main className="flex-1 grid min-h-0 p-3 gap-3"
                style={{ gridTemplateColumns: '280px 1fr 340px' }}>

            {/* LEFT: The Arena */}
            <LeftPanel
              busVoltage={busVoltage}
              batteryTemp={batteryTemp}
              isRunning={isRunning}
              aiPowerState={aiPowerState}
              systemStatus={systemStatus}
              onVoltageChange={setBusVoltage}
              onTempChange={setBatteryTemp}
              onInject={handleInject}
            />

            {/* CENTER: Hardware Twin */}
            <CenterPanel
              aiPowerState={aiPowerState}
              safetyGateStatus={safetyGateStatus}
              watchdogSec={watchdogSec}
            />

            {/* RIGHT: FDIR Log */}
            <RightPanel
              logEntries={logEntries}
              isRunning={isRunning}
            />
          </main>

          {/* FOOTER */}
          <footer className="flex items-center justify-center px-6 py-1.5"
                  style={{
                    background: 'rgba(11,15,25,0.95)',
                    borderTop: '1px solid #1e2d45',
                  }}>
            <span className="font-mono-tech text-xs tracking-widest"
                  style={{ color: '#2a3a55' }}>
              AEGIS-TWIN v1.0 · HACKATHON PROTOTYPE · NOT FLIGHT QUALIFIED
            </span>
          </footer>
        </div>
      );
    }

    // ─────────────────────────────────────────────────────────────────────────
    // MOUNT
    // ─────────────────────────────────────────────────────────────────────────
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
